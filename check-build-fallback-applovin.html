<head><script>(function FAKE_MRAID() {
  const listeners = {};
  const opened = [];
  window.mraid = {

    getAudioVolume: () => 100,
    addEventListener: (event, fn) => { (listeners[event] ||= []).push(fn); },
    removeEventListener: (event, fn) => { listeners[event] = (listeners[event] || []).filter((l) => l !== fn); },

      opened.push(url);

      box.innerHTML = '';
      const title = document.createElement('div');
      title.style.cssText = 'font-weight:700;font-size:18px;';

      const link = document.createElement('div');
      link.style.cssText = 'word-break:break-all;opacity:.8;font-size:13px;';
      link.textContent = url;
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;gap:10px;';
      const button = (text, onClick) => {
        const b = document.createElement('button');
        b.textContent = text;
        b.style.cssText = 'font:600 15px/1 inherit;padding:12px 16px;border:0;border-radius:10px;background:#38c65a;color:#fff;';
        b.addEventListener('click', onClick);
        return b;
      };

  let ext = null;
  let lostAt = 0;
  let tick = 0;

  const button = (text, onClick) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = text;
    b.style.cssText = 'font:600 13px/1 inherit;padding:9px 10px;border:0;border-radius:8px;background:#c0392b;color:#fff;';
    b.addEventListener('click', (e) => {
      e.stopPropagation();
      onClick();

    return b;
  };
  const status = document.createElement('span');

  const lose = button('Потерять WebGL', () => {
    const canvas = document.querySelector('canvas');
    const gl = canvas && (canvas.getContext('webgl2') || canvas.getContext('webgl'));
    ext = gl && gl.getExtension('WEBGL_lose_context');
    if (!ext) {
      status.textContent = 'нет WEBGL_lose_context';
      return;
    }
    lostAt = performance.now();
    ext.loseContext();
    clearInterval(tick);
    tick = setInterval(() => {
      const shown = document.getElementById('nice-fallback');
      const ms = Math.round(performance.now() - lostAt);
      if (shown && shown.isConnected) {
        clearInterval(tick);

        document.body.appendChild(panel);
      } else status.textContent = 'потерян ' + (ms / 1000).toFixed(1) + ' с';
    }, 100);
  });
  const restore = button('Вернуть', () => {

    clearInterval(tick);
    ext.restoreContext();
    status.textContent = 'возвращён';
  });
  restore.style.background = '#2d7d46';
  panel.append(lose, restore, status);
  const mount = () => document.body.appendChild(panel);
  if (document.body) mount();

})()</script>
