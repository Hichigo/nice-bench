<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NICE: физика crashcat</title>
<style>

  #stage canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh}
  .panel{position:fixed;left:12px;right:12px;padding:14px;background:rgba(0,0,0,.72);border-radius:12px}

</style>
</head>
