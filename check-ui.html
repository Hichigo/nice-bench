<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NICE: UI на устройствах</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font:15px/1.4 system-ui,sans-serif;touch-action:none}
  #stage canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh}
  .panel{position:fixed;left:12px;right:12px;padding:14px;background:rgba(0,0,0,.72);border-radius:12px}
  #start{bottom:calc(12px + env(safe-area-inset-bottom))} #done{top:calc(12px + env(safe-area-inset-top));bottom:calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
  #done[hidden],#start[hidden]{display:none}
  #status{position:fixed;left:12px;right:84px;top:calc(8px + env(safe-area-inset-top));font-size:13px;text-shadow:0 1px 2px #000;white-space:pre-line}
  button{font:inherit;font-weight:600;padding:12px 16px;border:0;border-radius:10px;background:#3d7bff;color:#fff}
  button:disabled{opacity:.6}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  textarea{flex:1;min-height:0;width:100%;box-sizing:border-box;font:11px/1.35 ui-monospace,monospace;background:#111;color:#cfe;border:1px solid #333;border-radius:8px;padding:8px;touch-action:auto}
  small{opacity:.75}
</style>
</head>
<body>
<div id="stage"></div>
<div id="status"></div>
<div id="start" class="panel">
  <b id="title"></b><br>
  <small id="desc"></small>
  <div class="row" id="buttons" style="margin-top:10px"></div>
</div>
<div id="done" class="panel" hidden>
  <b>Готово — отдайте эти данные</b>
  <div class="row"><button id="send">Отправить агенту</button><button id="copy">Копировать</button><button id="save">Сохранить файл</button><button id="again" style="background:#444">Ещё раз</button></div>
  <small id="copied"></small>
  <textarea id="out" readonly></textarea>
</div>
